/* =========================================================
   逻辑
   ========================================================= */
const $ = id => document.getElementById(id);
let current = 0;
const answers = new Array(QUESTIONS.length).fill(null);
let lastResult = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant' in window ? 'auto' : 'auto'});
}

/* ---------- 渲染题目 ---------- */
function renderQuestion(){
  const q = QUESTIONS[current];
  $('qIndex').textContent = current + 1;
  $('progressFill').style.width = ((current + 1) / QUESTIONS.length * 100) + '%';
  $('qTitle').textContent = q.q;

  const box = $('options');
  box.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.o.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[current] === i ? ' picked' : '');
    btn.innerHTML = `<span class="key">${keys[i]}</span><span>${text}</span>`;
    btn.addEventListener('click', () => chooseOption(i, btn));
    box.appendChild(btn);
  });

  $('prevBtn').disabled = (current === 0);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 选择选项 ---------- */
function chooseOption(idx, btn){
  if (btn.dataset.locked) return;
  document.querySelectorAll('.opt').forEach(b => b.dataset.locked = '1');
  answers[current] = idx;
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');

  setTimeout(() => {
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      finish();
    }
  }, 240);
}

/* ---------- 计算 & 出结果 ---------- */
function finish(){
  let total = 0;
  answers.forEach((a, i) => {
    if (a === null) return;
    total += SCORES[a];
  });
  let result = RESULTS[RESULTS.length - 1];
  for (const r of RESULTS){
    if (total >= r.min && total <= r.max){ result = r; break; }
  }
  lastResult = result;
  renderResult(total, result);
  showScreen('screen-result');
}

/* ---------- 渲染结果页 ---------- */

  $('resultHero').innerHTML = `
    <div class="hero-badge">${r.tag}</div>

  `;

  const legend = RADAR_KEYS.map((k, i) => `
    <div class="legend-item">
      <span class="lg-name">${k}</span>
      <span class="lg-bar"><i style="width:${r.radar[i] * 10}%"></i></span>

  $('resultBody').innerHTML = `

      <p class="card-warn">⚠️ 短板：${r.weakness}</p>
    </div>

    <div class="card">

      <p class="card-text">${r.fateText}</p>
    </div>

    <div class="card">

      <p class="card-text">${r.deep}</p>

/* ---------- 雷达图 ---------- */
function drawRadar(r){
  const canvas = $('radarCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(300, Math.max(220, window.innerWidth - 120));

  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const n = RADAR_KEYS.length;
  const cx = size / 2, cy = size / 2;
  const R = size * 0.33;
  const ang = i => -Math.PI / 2 + i * (2 * Math.PI / n);

  // 网格
  for (let ring = 1; ring <= 5; ring++){
    ctx.beginPath();
    const rr = R * ring / 5;
    for (let i = 0; i < n; i++){
      const a = ang(i);
      const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(217,180,106,0.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // 轴线
  for (let i = 0; i < n; i++){
    const a = ang(i);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = 'rgba(217,180,106,0.16)';
    ctx.stroke();
  }
  // 数据区域
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const a = ang(i);
    const rr = R * r.radar[i] / 10;
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(217,180,106,0.26)';
  ctx.fill();
  ctx.strokeStyle = '#d9b46a';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // 数据点
  for (let i = 0; i < n; i++){
    const a = ang(i);
    const rr = R * r.radar[i] / 10;
    ctx.beginPath();
    ctx.arc(cx + rr * Math.cos(a), cy + rr * Math.sin(a), 3, 0, Math.PI * 2);
    ctx.fillStyle = '#f6e6c0';
    ctx.fill();
  }

  // 标签
  ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#d9b46a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++){
    const a = ang(i);
    const rr = R + 20;
    ctx.fillText(RADAR_KEYS[i], cx + rr * Math.cos(a), cy + rr * Math.sin(a));
  }
}

/* ---------- 事件绑定 ---------- */
$('startBtn').addEventListener('click', () => {
  current = 0;
  answers.fill(null);
  renderQuestion();
  showScreen('screen-quiz');
});

$('prevBtn').addEventListener('click', () => {
  if (current > 0){
    current--;
    renderQuestion();
  }
});

$('restartBtn').addEventListener('click', () => {
  current = 0;
  answers.fill(null);
  lastResult = null;
  showScreen('screen-intro');
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!lastResult) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if ($('screen-result').classList.contains('active')) drawRadar(lastResult);
  }, 180);
});
</script>
